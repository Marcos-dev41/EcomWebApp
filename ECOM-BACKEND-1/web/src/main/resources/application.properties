spring.config.import=optional:file:.env[.properties]
spring.application.name=web
server.port =8082

#JWT SECRETS AND EXPIRATION KEY VARIABLES
jwt.secret = ${JWT_SECRET}
jwt.expiration =${JWT_EXPIRATION}

# MPESA PAYMENT INTEGRATION VARIABLES
consumer.key = ${CONSUMER_KEY}
consumer.secret = ${CONSUMER_SECRET}
bs.shortcode= ${BUSINESS_SHORTCODE}
callback.url= ${CALLBACK_URL}
passkey = ${PASS_KEY}


# PAYPAL CREDENTIALS
paypal.client.id=${PAYPAL_CLIENT_ID}
paypal.client.secret=${PAYPAL_CLIENT_SECRET}
paypal.base.url=https://api-m.sandbox.paypal.com


# DATABASE CONFIG VARIABLES
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_USERNAME}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

# Print the actual SQL queries being executed to the console
spring.jpa.show-sql=true

# Format the printed SQL so it's easy to read
spring.jpa.properties.hibernate.format_sql=true

# Show the actual values being bound to parameters
logging.level.org.hibernate.orm.jdbc.bind=trace


# RABBITMQ CREDENTIALS
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${AMP_USERNAME}
spring.rabbitmq.password=${AMP_PASSWORD}

# MAIL SERVER
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

#Configs for redis cache storage

spring.redis.host=localhost  
spring.redis.port=6379  

